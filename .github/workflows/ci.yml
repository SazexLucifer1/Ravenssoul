name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.6-stable"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download Godot
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Tests, localization, automation client + headless scenario, gating, boot smoke runs
        run: tests/run_tests.sh

  automation-e2e:
    # Full scenario with a real renderer so the protocol screenshot path is exercised.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Download Godot
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: '"$GODOT" --headless --import >/dev/null 2>&1 || true'
      - name: First-mission scenario (screenshot required)
        run: |
          PYTHONPATH=tools/automation xvfb-run -a -s "-screen 0 1280x720x24" \
            python3 -m utopia_automation scenario first_mission --godot "$GODOT" --project . \
            --out automation-output --require-screenshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-e2e
          path: automation-output/

  locale-screenshots:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Download Godot
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Capture en/de/pseudo/rtl screenshots
        run: |
          "$GODOT" --headless --import >/dev/null 2>&1 || true
          xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . --rendering-driver opengl3 --audio-driver Dummy \
            res://tests/tools/screenshot_capture.tscn -- --out="$PWD/screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: locale-screenshots
          path: screenshots/*.png
